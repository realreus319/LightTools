name: Format M8 experience components

on:
  push:
    branches: [feat/commercial-v1]
    paths:
      - '.github/workflows/format-m8-final.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/commercial-v1
      - uses: pnpm/action-setup@v6
        with:
          version: 10.11.1
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/components/common/responsive-dialog.tsx src/components/common/result-copy-button.tsx src/components/tool-shell/tool-page-actions.tsx
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/common/responsive-dialog.tsx src/components/common/result-copy-button.tsx src/components/tool-shell/tool-page-actions.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: format M8 experience components'
          git push origin HEAD:feat/commercial-v1
