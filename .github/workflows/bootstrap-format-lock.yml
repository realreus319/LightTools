name: Bootstrap formatting and lockfile

on:
  push:
    branches: [feat/commercial-v1]
    paths:
      - '.github/workflows/bootstrap-format-lock.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/commercial-v1
      - uses: pnpm/action-setup@v6
        with:
          version: 10.11.1
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install and create lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Format repository
        run: pnpm format
      - name: Commit normalized files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json pnpm-lock.yaml CODESTYLE.md docs/product/SPECS.md THIRD_PARTY_NOTICES.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: lock dependencies and format baseline'
          git push origin HEAD:feat/commercial-v1
