name: Format M7 fixes

on:
  push:
    branches: [feat/commercial-v1]
    paths:
      - '.github/workflows/format-m7-fixes.yml'

permissions:
  contents: write

concurrency:
  group: lighttools-format-m7-fixes
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/commercial-v1
      - uses: pnpm/action-setup@v6
        with:
          version: 10.11.1
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/features/tools/text/encoding-tools.tsx src/features/tools/text/qr-tool.tsx src/features/tools/text/regex/regex.worker.ts
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/tools/text/encoding-tools.tsx src/features/tools/text/qr-tool.tsx src/features/tools/text/regex/regex.worker.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: format M7 fixes'
          git push origin HEAD:feat/commercial-v1
