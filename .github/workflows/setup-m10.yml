name: Prepare M10 test tooling

on:
  push:
    branches: [feat/commercial-v1]
    paths:
      - '.github/workflows/setup-m10.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/commercial-v1
      - uses: pnpm/action-setup@v6
        with:
          version: 10.11.1
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm add -D @playwright/test@1.62.1 @lhci/cli@0.15.1
      - run: pnpm format
      - name: Commit tooling and formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git reset .github/workflows/setup-m10.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: add M10 test tooling'
          git push origin HEAD:feat/commercial-v1
