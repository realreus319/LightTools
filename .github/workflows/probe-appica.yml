name: Probe Appica package metadata

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-appica.yml'

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read npm metadata
        run: |
          npm view @appica/ui-react version
          npm view @appica/ui-react license
          npm view @appica/ui-react repository.url
          npm view @appica/ui-react peerDependencies --json
