name: Finalize text milestone

on:
  push:
    branches: [feat/commercial-v1]
    paths:
      - '.github/workflows/finalize-text-milestone.yml'

permissions:
  contents: write

concurrency:
  group: lighttools-finalize-text
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/commercial-v1
      - uses: pnpm/action-setup@v6
        with:
          version: 10.11.1
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Verify QR dependency metadata
        run: |
          npm view qrcode@1.5.4 version license repository.url
          npm view @types/qrcode@1.5.6 version license
      - name: Lock dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Register completed tools
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          registry_path = Path('src/lib/tool-registry/tools.ts')
          registry = registry_path.read_text()
          for slug in [
              'pdf-merge', 'pdf-split', 'image-to-pdf', 'pdf-to-image',
              'json-format', 'base64', 'url-codec', 'text-stats', 'text-clean',
              'uuid', 'timestamp', 'hash', 'jwt-decode', 'regex',
          ]:
              pattern = rf"(slug: '{re.escape(slug)}'[\s\S]*?status: )'planned'"
              registry, count = re.subn(pattern, r"\1'beta'", registry, count=1)
              if count != 1:
                  raise SystemExit(f'Could not update status for {slug}')

          if "slug: 'text-diff'" not in registry:
              entries = """
            {
              slug: 'text-diff',
              category: 'text',
              titleKey: 'tools.text-diff.title',
              descriptionKey: 'tools.text-diff.description',
              keywords: ['diff', 'compare', 'text', '差异', '对比'],
              aliases: ['text diff', '文本对比'],
              icon: 'text-diff',
              inputKinds: ['text/plain'],
              outputKinds: ['text/plain'],
              localOnly: true,
              related: ['text-clean', 'json-format'],
              status: 'beta',
            },
            {
              slug: 'qr-code',
              category: 'utility',
              titleKey: 'tools.qr-code.title',
              descriptionKey: 'tools.qr-code.description',
              keywords: ['qr', 'qrcode', '二维码', 'svg', 'png'],
              aliases: ['QR code generator', '二维码生成'],
              icon: 'qr-code',
              inputKinds: ['text/plain'],
              outputKinds: ['image/svg+xml', 'image/png'],
              localOnly: true,
              featured: true,
              related: ['base64', 'url-codec'],
              status: 'beta',
            },
            {
              slug: 'cron-explain',
              category: 'developer',
              titleKey: 'tools.cron-explain.title',
              descriptionKey: 'tools.cron-explain.description',
              keywords: ['cron', 'schedule', 'expression', '定时', '表达式'],
              aliases: ['cron explainer', 'Cron 解析'],
              icon: 'cron',
              inputKinds: ['text/plain'],
              outputKinds: ['text/plain'],
              localOnly: true,
              related: ['timestamp', 'regex'],
              status: 'beta',
            },
          """
              registry = registry.replace('\n] as const', entries + '\n] as const', 1)
          registry_path.write_text(registry)

          messages_path = Path('src/i18n/messages.ts')
          messages = messages_path.read_text()
          if "'text-diff':" not in messages:
              zh_insert = """    'text-diff': { title: '文本差异对比', description: '按行比较两段文本，清楚标记新增、删除与未变化内容。' },
              'qr-code': { title: '二维码生成', description: '在浏览器本地生成可下载的 SVG 与 PNG 二维码。' },
              'cron-explain': { title: 'Cron 解析', description: '校验并解释标准 5 段 Cron 表达式。' },
          """
              en_insert = """    'text-diff': { title: 'Text Diff', description: 'Compare two texts line by line with clear additions, removals, and unchanged lines.' },
              'qr-code': { title: 'QR Code Generator', description: 'Generate downloadable SVG and PNG QR codes locally in your browser.' },
              'cron-explain': { title: 'Cron Explainer', description: 'Validate and explain standard five-field cron expressions.' },
          """
              parts = messages.split('    regex:', 2)
              if len(parts) != 3:
                  raise SystemExit('Could not find both regex tool-copy anchors')
              messages = parts[0] + zh_insert + '    regex:' + parts[1] + en_insert + '    regex:' + parts[2]
          messages_path.write_text(messages)

          notices_path = Path('THIRD_PARTY_NOTICES.md')
          notices = notices_path.read_text()
          if '| qrcode' not in notices:
              notices = notices.replace(
                  '| Vitest',
                  '| qrcode                         | 1.5.4   | Browser QR code generation | MIT; retain applicable notices                         |\n| Vitest',
                  1,
              )
          notices_path.write_text(notices)
          PY
      - name: Format repository
        run: pnpm format
      - name: Commit milestone normalization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: register and format text milestone'
          git push origin HEAD:feat/commercial-v1
